<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="eWgaDpc3QbGzKsuAmkei7WYgQZTCksTt6OX3URK8c20" />
  <title>Simple Calculator</title>
  <title>Simple Calculator Online | Made by ERROR</title>

<meta name="description"
content="Use this free online calculator for addition, subtraction, multiplication and division. Simple, fast and easy to use. Made by ERROR.">

<meta name="robots" content="index, follow">

<link rel="canonical"
href="https://simple-calculator-ten-blond.vercel.app/">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="result" id="display">0</div>
    </div>

    <section class="keys">
      <button class="key number" data-value="7">7</button>
      <button class="key number" data-value="8">8</button>
      <button class="key number" data-value="9">9</button>
      <button class="key operator" data-operator="/">÷</button>

      <button class="key number" data-value="4">4</button>
      <button class="key number" data-value="5">5</button>
      <button class="key number" data-value="6">6</button>
      <button class="key operator" data-operator="*">×</button>

      <button class="key number" data-value="1">1</button>
      <button class="key number" data-value="2">2</button>
      <button class="key number" data-value="3">3</button>
      <button class="key operator" data-operator="-">−</button>

      <button class="key number" data-value="0">0</button>
      <button class="key number" data-value=".">.</button>
      <button class="key clear" data-action="clear">C</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key equals" data-action="equals">=</button>
    </section>
  </main>
  <script src="script.js"></script>
  <script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
